<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="微信公众号文章出版归档 Logo">
  <title>微信公众号文章出版归档</title>

  <!--
    设计说明（方向 A：折角文档 · 气泡）
    · 主体 = 一张右上折角的纸张，隐喻“文章被归档成文档”
    · 折角 = 浅蓝高光，让纸张有“翻折”的立体暗示，同时避免大片纯色呆板
    · 右下角绿色对话气泡 = 点明内容来源是微信公众号
    · 气泡外描一圈白边，作用是：无论放在浅色还是深色背景上，
      蓝色纸张与绿色气泡之间都有一条清晰的视觉分隔，不会糊在一起
    配色：
    · 主色   深蓝 #2563EB （与归档页 archive-theme.css 的 --archive-primary 一致）
    · 高光   浅蓝 #60A5FA （归档页品牌圆点用的同款渐变浅色）
    · 点缀   微信绿 #07C160（仅用于来源标识，不喧宾夺主）
  -->

  <!-- 纸张主体：圆角矩形 + 右上角切角，半径 26 -->
  <path d="M60 26 H134 L180 72 V174 Q180 200 154 200 H60 Q34 200 34 174 V52 Q34 26 60 26 Z"
        fill="#2563EB"/>

  <!-- 折角：右上角被折起的那一小块三角形 -->
  <path d="M134 26 L180 72 L134 72 Z" fill="#60A5FA"/>

  <!-- 纸张上的正文示意线：三段白色横线，长度递减，像排好版的文章 -->
  <g stroke="#FFFFFF" stroke-width="12" stroke-linecap="round">
    <path d="M60 78 H156"/>
    <path d="M60 110 H156"/>
    <path d="M60 142 H118"/>
  </g>

  <!-- 右下角对话气泡：圆角矩形 + 左下小尾巴，外描 8px 白边做分隔 -->
  <path d="M170 144 H216 Q238 144 238 166 V188 Q238 210 216 210 H208 L190 232 L186 210 H170 Q148 210 148 188 V166 Q148 144 170 144 Z"
        fill="#07C160" stroke="#FFFFFF" stroke-width="8" stroke-linejoin="round"/>

  <!-- 气泡里的两行短横线：表示“一条消息 / 一篇文章摘要” -->
  <g stroke="#FFFFFF" stroke-width="10" stroke-linecap="round">
    <path d="M172 172 H214"/>
    <path d="M172 192 H196"/>
  </g>
</svg>
